worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    client_max_body_size 64k;
    client_body_timeout 15s;
    keepalive_timeout 15s;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /healthz { return 200 'ok'; }
    location /api/ {
      # Resolve the service name again after Docker replaces the API container.
      resolver 127.0.0.11 valid=5s ipv6=off;
      resolver_timeout 3s;
      set $api_backend api:8000;
      proxy_pass http://$api_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
