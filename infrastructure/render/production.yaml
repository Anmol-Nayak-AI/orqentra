# TEMPLATE ONLY. Do not apply without explicit approval: applying creates paid resources.
# Database/runtime role/CA and migration job are provisioned separately after approval.
# No provider calls or deployment commands are run by repository CI.
services:
  - type: pserv
    name: orqentra-production-api
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerContext: .
    dockerfilePath: apps/api/Dockerfile
    autoDeployTrigger: "off"
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: orqentra-production-runtime
  - type: worker
    name: orqentra-production-worker
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerContext: .
    dockerfilePath: apps/api/Dockerfile
    dockerCommand: python -m orqentra.execution.worker
    autoDeployTrigger: "off"
    maxShutdownDelaySeconds: 90
    envVars:
      - fromGroup: orqentra-production-runtime
      - key: ORQENTRA_WORKER_ORGANIZATIONS
        sync: false
  - type: web
    name: orqentra-production-web
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerContext: .
    dockerfilePath: apps/web/Dockerfile
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    envVars:
      - key: ORQENTRA_DEPLOYMENT_ENV
        value: production
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: ORQENTRA_API_UPSTREAM
        fromService:
          name: orqentra-production-api
          type: pserv
          property: hostport

envVarGroups:
  - name: orqentra-production-runtime
    envVars:
      - key: ORQENTRA_ENVIRONMENT
        value: production
      - key: ORQENTRA_ALLOWED_HOSTS
        sync: false
      - key: ORQENTRA_DATABASE_URL
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_JWT_KEY
        sync: false
      - key: CLERK_ALLOWED_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
