name: orqentra
services:
  postgres:
    image: orqentra-postgres-vector
    build:
      context: ..
      dockerfile: infrastructure/postgres/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orqentra_local_owner}
      POSTGRES_DB: ${POSTGRES_DB:-orqentra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup before starting Compose}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    shm_size: 128mb
  api:
    image: orqentra-api
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      ORQENTRA_ENVIRONMENT: development
    # Optional restricted credentials generated by make runtime-setup. Never owner credentials.
    env_file:
      - path: ../.env.runtime
        required: false
      - path: ../.env.auth
        required: false
      - path: ../.env.ai
        required: false
      - path: ../.env.billing
        required: false
      - path: ../.env.telemetry
        required: false
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  worker:
    profiles: [ai]
    image: orqentra-api
    command: [python, -m, orqentra.execution.worker]
    environment:
      ORQENTRA_ENVIRONMENT: development
    env_file:
      - path: ../.env.runtime
        required: false
      - path: ../.env.ai
        required: false
      - path: ../.env.worker
        required: false
      - path: ../.env.sandbox
        required: false
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import pathlib,time; assert time.time()-float(pathlib.Path('/tmp/orqentra-worker-heartbeat').read_text())<150"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  postgres_data:
